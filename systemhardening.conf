server {
    listen 80;  # 生产环境建议使用 80 端口
    # 如果你要使用 8081 端口，修改为：listen 8081;
    server_name 10.66.254.155;  # 修改为你的服务器 IP

    # 前端静态资源
    location / {
        root /path/to/your/frontend/dist;  # 修改为实际部署的 dist 目录路径，例如：/var/www/system-hardening/dist
        index index.html index.htm;
        
        # SPA 路由支持 - Vue Router 在 history 模式下必须配置
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 接口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        
        # 上传文件大小限制（根据实际需要调整）
        client_max_body_size 100M;  # 支持最大 100MB 的文件上传
        
        # 代理头部设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置（针对大文件上传增加超时时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存（优化性能）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_comp_level 6;

    # 日志配置
    access_log /var/log/nginx/system_hardening_access.log;
    error_log /var/log/nginx/system_hardening_error.log;
}
