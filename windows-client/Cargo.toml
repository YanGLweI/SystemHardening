[package]
name = "windows_hardening_client"
version = "2.3.7"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
winreg = "0.56"
wmi = "0.18"
windows-service = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
md5 = "0.7"
hex = "0.4"